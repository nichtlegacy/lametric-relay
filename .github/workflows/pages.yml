name: Deploy Pages

# Publishes the display preview. The page is generated by importing the add-ins
# and recording what they return, so it has to be rebuilt whenever they change,
# not only when the site itself does.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'addins/**'
      - 'scripts/build-preview.py'
      - 'assets/icons.json'
      - 'hub.py'
      - 'lametric.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins: the page is a snapshot of main, so an
# in-flight older build has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install ImageMagick
        # Only the icon fetcher needs it. The build itself is stdlib only.
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Fetch icons
        # The preview embeds them as base64, exactly as the hub sends them.
        run: scripts/fetch-icons.py

      - name: Build preview
        run: scripts/build-preview.py --check

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
