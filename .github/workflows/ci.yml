name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests never contact a device, but the key must still be set.
  LAMETRIC_KEY: test

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install ImageMagick
        # Only needed for the icons and the two icon tools. Runtime has no
        # dependencies: stdlib only, so there is no pip install.
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Fetch icons
        # Not stored in the repo; see assets/icons.json. Without them, tests would
        # use icon paths that do not exist.
        run: |
          scripts/fetch-icons.py
          scripts/fetch-icons.py --check

      - name: Compile sources
        run: python -m compileall hub.py lametric.py quota.py names.py addins scripts tests

      - name: Run tests
        run: |
          for suite in tests/test_*.py; do
            echo "--- $suite"
            python "$suite"
          done

      - name: Add-ins load
        run: |
          python hub.py --list > addins.txt
          cat addins.txt
          for name in forgejo kuma plex psn say; do
            grep -q "^$name " addins.txt
          done

      - name: Add-ins needing configuration stay unloaded
        # codex needs Codex-LB and claude needs an ai-usage-insights database.
        # Without those settings, the hub must not load them or they would fail
        # every minute.
        run: |
          for name in codex claude clockface; do
            if grep -q "^$name " addins.txt; then
              echo "$name was loaded without configuration"
              exit 1
            fi
          done

      - name: Preview builds from the add-ins
        # The published page is generated from the add-ins themselves, so a change
        # that breaks it breaks here rather than on the site.
        # --no-library: the check only cares that the add-ins still produce their
        # frames, and pulling two hundred icons off a third-party API on every
        # push would be both slow and rude. The Pages build fetches them.
        run: scripts/build-preview.py --check --no-library

      - name: Icon tools work
        run: |
          printf '...##...\n...##...\n' | scripts/pixelart.py probe.png '#D97757'
          scripts/icon.py --preview probe.png > /dev/null

  docker_build_check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        # The first stage fetches icons from the LaMetric library, so the build
        # requires network access.
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          push: false
          load: true
          tags: lametric-ci:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs and carries every add-in
        run: |
          docker run --rm -e LAMETRIC_KEY=test lametric-ci:check ./hub.py --list > image-addins.txt
          cat image-addins.txt
          for name in forgejo kuma plex psn say; do
            grep -q "^$name " image-addins.txt
          done

      - name: Runtime image stays free of ImageMagick
        run: |
          if docker run --rm --entrypoint sh lametric-ci:check -c 'command -v convert magick' ; then
            echo "ImageMagick landed in the runtime image"
            exit 1
          fi
